[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-to-api"
version = "2.0.0"
description = "OpenAI and Anthropic compatible local API gateway for WorkBuddy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "workbuddy_to_api contributors" }]
keywords = ["workbuddy", "openai", "anthropic", "mcp", "api-proxy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.scripts]
workbuddy-to-api = "workbuddy_to_api:main"

[tool.setuptools]
py-modules = ["workbuddy_to_api"]
